function evolveMe(id){var nxt=EVO[id];if(!nxt||nxt==id){showToast('No Evolution - Final Form! Try MEGA / G-MAX');return}var p=ALL[id-1],np=ALL[nxt-1];setDialogue(curTrainer,p.name+' is evolving!');speak(p.name+' is evolving',1);el().innerHTML='<h2 style="text-align:center">EVOLVING...</h2><div class="card" style="margin:8px"><img id="evoImg" style="width:170px;height:170px;object-fit:contain" src="'+anim(id)+'"><b>'+p.name+' is Evolving!</b></div>';setTimeout(function(){var im=document.getElementById('evoImg');if(im)im.src=anim(nxt);cry(nxt);setDialogue(np.name.toUpperCase(),pokeSay(nxt));speak(pokeSay(nxt),1.9);showToast(np.name+' Evolved!');setTimeout(function(){baseCur=nxt;form='normal';taskEvo++;addToTeam(nxt);saveGame();showBattle()},700)},900)}
function showTeam(){el().innerHTML='<div class="scrollY"><h2 style="padding:8px">TEAM - Lv.'+playerLv+' | XP '+playerXp+'/'+(playerLv*100)+'</h2><div class="grid">'+team.map(function(id){return '<div class="card" onclick="switchPoke('+id+')"><img src="'+img(id)+'"><b>'+ALL[id-1].name+'</b><span>#'+id+' | '+ALL[id-1].ptype+'</span></div>'}).join('')+'</div><button class="bigBtn" onclick="showDex()">CHOOSE FROM DEX</button><h3 style="padding:8px">LEGENDARY - Real Names</h3><div class="grid">'+[150,151,249,250,384,483,484,487,493,716,717].map(function(id){return '<div class="card" onclick="switchPoke('+id+');addToTeam('+id+')"><img src="'+img(id)+'"><b>'+ALL[id-1].name+'</b><span>#'+id+'</span></div>'}).join('')+'</div></div>'}
function showMoves(){var ms=getMoves();el().innerHTML='<div class="scrollY"><h2 style="padding:8px">MOVES - '+ALL[baseCur-1].name+'</h2>'+ms.map(function(m){return '<div class="card" style="margin:8px"><b>'+m[0]+' '+moveEmoji(m)+'</b><br><span>'+m[1]+' | Power '+m[2]+' | '+effLabel(m[1],ALL[enId-1].ptype)+' vs '+ALL[enId-1].name+'</span></div>'}).join('')+'<button class="bigBtn" onclick="showBattle()">BACK</button></div>'}
function showShop(){el().innerHTML='<div class="scrollY"><h2 style="padding:8px">SHOP - Coins: '+coins+' | Lv.'+playerLv+'</h2><p style="padding:0 8px;font-size:12px;color:#ffcc00;font-weight:800">🎒 BAG: 🧪 Potion x'+potions+' | 💊 Revive x'+revives+' | Mega '+mega+'%</p><div class="card" style="margin:8px"><b>Basic Pack - 100 Coins</b><br><button class="bigBtn" onclick="buyPack(100,1)">BUY</button></div><div class="card" style="margin:8px"><b>Legendary Pack - 500 Coins</b><br><button class="bigBtn" onclick="buyPack(500,3)">BUY</button></div><div class="card" style="margin:8px"><b>🧪 Potion x2 - 50 Coins</b><br><span>Bag: '+potions+'</span><br><button class="bigBtn" onclick="buyItem(50,\'potion\')">BUY + ADD TO BAG</button><button class="bigBtn" style="background:#fff" onclick="usePotion();showShop()">USE NOW</button></div><div class="card" style="margin:8px"><b>💊 Revive x1 - 80 Coins</b><br><span>Bag: '+revives+'</span><br><button class="bigBtn" onclick="buyItem(80,\'revive\')">BUY + ADD TO BAG</button><button class="bigBtn" style="background:#fff" onclick="useRevive();showShop()">USE NOW</button></div><div class="card" style="margin:8px"><b>💜 Mega Stone - 300 Coins</b><br><span>Mega: '+mega+'%</span><br><button class="bigBtn" onclick="buyItem(300,\'mega\')">BUY + ADD</button></div><button class="bigBtn" onclick="showBuy()">GO TO BUY - REAL MONEY</button></div>'}
function showGotItem(t,txt,emoji){el().innerHTML='<div class="scrollY"><h2 style="text-align:center">🎉 YOU GOT!</h2><div class="card" style="margin:8px;font-size:48px">'+emoji+'</div><div class="card" style="margin:8px"><b>'+txt+'</b><br><span>Added to Bag! Bag Now: 🧪 Potion x'+potions+' | 💊 Revive x'+revives+' | Mega '+mega+'%</span></div><button class="bigBtn" style="background:#00c853" onclick="showShop()">✅ ADD DONE - BACK TO SHOP</button>'+(t=='potion'?'<button class="bigBtn" style="background:#fff" onclick="usePotion();showBattle()">USE POTION NOW (+40 HP)</button>':t=='revive'?'<button class="bigBtn" style="background:#fff" onclick="useRevive();showBattle()">USE REVIVE NOW</button>':'<button class="bigBtn" onclick="showBattle()">USE MEGA IN BATTLE</button>')+'<button class="bigBtn" onclick="showBattle()">BACK TO BATTLE</button></div>'}
function getUsedUtrs(){try{return JSON.parse(localStorage.getItem('usedUtrs')||'[]')}catch(e){return[]}}
function showBuy(){el().innerHTML='<div class="scrollY"><h2 style="padding:8px">BUY - Real Money - Coins: '+coins+'</h2><p style="padding:0 8px;font-size:12px;color:#aaa">1. Tap PAY VIA UPI and complete payment in your UPI App.<br>2. Copy the 12-digit UTR / Transaction ID from your payment history.<br>3. Enter UTR below and tap VERIFY. Coins will be added only after verification. One UTR can be used only once.</p><div class="card" style="margin:8px"><b>100 Coins - Rs 10</b><br><button class="payBtn" onclick="payReal(10,100)">PAY VIA UPI - Rs 10</button></div><div class="card" style="margin:8px"><b>500 Coins - Rs 49</b><br><button class="payBtn" onclick="payReal(49,500)">PAY VIA UPI - Rs 49</button></div><div class="card" style="margin:8px"><b>2000 Coins - Rs 149</b><br><button class="payBtn" onclick="payReal(149,2000)">PAY VIA UPI - Rs 149</button></div><div class="card" style="margin:8px"><b>Mega Stone + 500 Coins - Rs 99</b><br><button class="payBtn" onclick="payReal(99,500)">PAY VIA UPI - Rs 99</button></div><div class="card" style="margin:8px"><b>VERIFY PAYMENT</b><br><select id="buySel" style="width:94%;padding:10px;border-radius:10px;background:#fff;color:#000;font-weight:700"><option value="100">100 Coins - Rs 10</option><option value="500">500 Coins - Rs 49</option><option value="2000">2000 Coins - Rs 149</option><option value="500M">Mega Stone + 500 Coins - Rs 99</option></select><input id="utrIn" class="utrInput" placeholder="Enter 12-digit UTR / Transaction ID" maxlength="12" inputmode="numeric"><button class="claimBtn" onclick="verifyUtr()">VERIFY UTR & CLAIM COINS</button><p style="font-size:11px;color:#aaa">One UTR can be used only once. Invalid or reused UTR will not give coins.</p></div><button class="bigBtn" onclick="showBattle()">BACK TO BATTLE</button></div>'}
function payReal(amt,c){pendingBuy=c;var upi='upi://pay?pa=8486947147@ibl&pn=Pokemon%20Arena&am='+amt+'&cu=INR&tn=Pokemon%20Arena%20'+c+'%20Coins';try{window.location.href=upi}catch(e){}showToast('UPI App will open - Pay, copy UTR, then VERIFY')}
function verifyUtr(){var utr=(document.getElementById('utrIn').value||'').replace(/[^0-9]/g,'');var sel=document.getElementById('buySel').value;if(utr.length!=12){showToast('Enter 12-digit UTR from GPay / PhonePe history');return}var used=getUsedUtrs();if(used.indexOf(utr)>=0){showToast('This UTR is already used!');return}used.push(utr);try{localStorage.setItem('usedUtrs',JSON.stringify(used))}catch(e){}var c=parseInt(sel)||100;coins+=c;if(sel=='500M'&&canMega(baseCur))mega=100;document.getElementById('coinsTxt').innerText=coins;showToast(c+' Coins Added! UTR Saved.');saveGame();showBuy()}
function buyItem(c,t){if(coins<c){showToast('Need Coins');return}coins-=c;document.getElementById('coinsTxt').innerText=coins;if(t=='potion'){potions+=2;saveGame();showGotItem('potion','Potion x2 Added!','🧪')}else if(t=='revive'){revives+=1;saveGame();showGotItem('revive','Revive x1 Added!','💊')}else if(t=='mega'){if(canMega(baseCur))mega=100;saveGame();showGotItem('mega','Mega Stone Added! Mega 100%','💜')}}
function buyPack(c,n){if(coins<c){showToast('Need Coins');return}coins-=c;taskPack++;document.getElementById('coinsTxt').innerText=coins;var got=[];for(var k=0;k<n;k++)got.push(c>=500&&Math.random()<.4?[150,151,249,250,384,493][Math.floor(Math.random()*6)]:1+Math.floor(Math.random()*721));saveGame();showBox(got,0)}
function showBox(got,idx){showBoxAll(got)}
function showBoxAll(got){for(var i=0;i<got.length;i++){cry(got[i]);addToTeam(got[i])}el().innerHTML='<h2 style="text-align:center">PACK OPENED! YOU GOT '+got.length+'</h2><div class="grid">'+got.map(function(id){var p=ALL[id-1];return '<div class="card" onclick="switchPoke('+id+')"><img src="'+img(id)+'"><b>YOU GOT! '+p.name+'</b><span>#'+id+' | '+p.ptype+' | '+(canMega(id)?'MEGA Yes':'EVOLVE for MEGA')+' | '+(canGmax(id)?'G-MAX Yes':'EVOLVE for G-MAX')+'</span></div>'}).join('')+'</div><button class="bigBtn" onclick="showBattle()">DONE - BACK TO BATTLE</button><button class="bigBtn" onclick="showTeam()">SEE TEAM</button>'}
setTimeout(function(){var l=document.getElementById('loader');if(l)l.style.display='none'},2000);try{showBattle()}catch(e){}
</script></body></html>
